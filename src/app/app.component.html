<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    font-family:
      "Inter",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Helvetica,
      Arial,
      sans-serif,
      "Apple Color Emoji",
      "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    font-size: 20px;
    line-height: 100%;
    margin: 0;
    font-family:
      "Inter Tight",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Helvetica,
      Arial,
      sans-serif,
      "Apple Color Emoji",
      "Segoe UI Emoji",
      "Segoe UI Symbol";
  }
</style>

<main>
  <div class="bg-violet/15 py-6">
    <h1 class="text-violet font-semibold">Photo facturing</h1>
  </div>

  <button class="bg-violet text-white rounded-lg py-2 px-4 hover:bg-violet/90">
    Open camera

    <input
      type="file"
      accept="image/*"
      capture="camera"
      (change)="onFileSelected($event)"
      class="w-full h-full opacity-0 absolute inset-0 cursor-pointer"
    />
  </button>
</main>

<router-outlet></router-outlet>
